# Local development services (section 4): Postgres, MinIO (local S3), Mailpit (local email), ClamAV.
# The app itself runs on the host: `pnpm dev`. See README.md.
name: verilo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verilo_owner
      POSTGRES_PASSWORD: verilo
      POSTGRES_DB: verilo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verilo_owner -d verilo"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: verilo
      MINIO_ROOT_PASSWORD: verilo-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 verilo verilo-secret &&
      mc mb --ignore-existing local/verilo-files &&
      mc mb --ignore-existing local/verilo-exports &&
      mc anonymous set none local/verilo-files"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["8025:8025", "1025:1025"]

  clamav:
    build: ./infra/images/clamav
    ports: ["8090:8080"]
    healthcheck:
      # clamd loads its signature database on start; this can take a minute or two.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

volumes:
  pgdata:
  miniodata:
