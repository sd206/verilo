# Local development services (section 4): Postgres, MinIO (local S3), Mailpit (local email), ClamAV.
# The app itself runs on the host: `pnpm dev`. See README.md.
name: verilo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verilo_owner
      POSTGRES_PASSWORD: verilo
      POSTGRES_DB: verilo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verilo_owner -d verilo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO's own images were removed from Docker Hub and quay.io; this is Chainguard's build of
  # the same server. Pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    user: "0:0"
    environment:
      MINIO_ROOT_USER: verilo
      MINIO_ROOT_PASSWORD: verilo-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:cd7f5d19d115615d809f27343b1e5cfbdc84f38e1c9a29475535b74ec5bade50
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 verilo verilo-secret >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/verilo-files
        mc mb --ignore-existing local/verilo-exports
        mc anonymous set none local/verilo-files
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["8025:8025", "1025:1025"]

  clamav:
    build: ./infra/images/clamav
    ports: ["8090:8080"]
    healthcheck:
      # clamd loads its signature database on start; this can take a minute or two.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

volumes:
  pgdata:
  miniodata:
